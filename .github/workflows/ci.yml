name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dbt,dev]"

      - name: Lint
        run: ruff check src tests airflow

      - name: Unit tests (ingestion + loader, fully offline)
        run: pytest -q

      - name: End-to-end on fixtures (land -> load -> dbt build with all data tests)
        run: |
          vulnintel demo
          vulnintel dbt build
