[project]
name = "vulnintel"
version = "0.1.0"
description = "Vulnerability intelligence warehouse: NVD + EPSS + CISA KEV -> lakehouse landing zone -> DuckDB/BigQuery -> dbt"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.1",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.10,<1.13", "dbt-duckdb>=1.10"]
bigquery = ["google-cloud-bigquery>=3.20", "dbt-bigquery>=1.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vulnintel = "vulnintel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP017"]  # keep timezone.utc: reads clearer for most readers

[tool.ruff.lint.isort]
known-first-party = ["vulnintel", "fakes"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
